# FreeBuds Pro 5: AAC drops the A2DP transport every few minutes on this stack
# ("spa.bluez5: Failure in Bluetooth audio transport ... /sep11/fd0"), which
# leaves the card without A2DP profiles. SBC-XQ is the stable high-bitrate
# option here; AAC is excluded so WirePlumber cannot fall back to it.
monitor.bluez.properties = {
  bluez5.codecs = [ sbc sbc_xq ]
  bluez5.enable-msbc = true
}
