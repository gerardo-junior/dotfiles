# FreeBuds Pro 5 on artemis.
#
# LDAC is the best codec this headset exposes that PipeWire can speak
# (L2HC is Huawei-proprietary and unsupported). HQ = 990 kbps / 96 kHz.
# SBC/SBC-XQ stay as fallbacks because LDAC is fragile with a weak link.
#
# AAC is deliberately absent: it dropped the A2DP transport within minutes
# ("spa.bluez5: Failure in Bluetooth audio transport ... /sep11/fd0"), which
# corrupted the remote SEP cache and left the card with no A2DP profile.
monitor.bluez.properties = {
  bluez5.codecs = [ ldac sbc sbc_xq ]
  bluez5.a2dp.ldac.quality = hq
  bluez5.enable-hw-volume = true
}
